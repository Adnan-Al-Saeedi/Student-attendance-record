name: نشر التطبيق على GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: إنشاء config.js من الأسرار
        env:
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
        run: |
          if [ -z "$APPS_SCRIPT_URL" ]; then echo "::error::أضف السر APPS_SCRIPT_URL في إعدادات المستودع"; exit 1; fi
          mkdir -p site
          cp index.html app.js site/
          node -e 'require("fs").writeFileSync("site/config.js", "window.APP_CONFIG = " + JSON.stringify({ scriptUrl: process.env.APPS_SCRIPT_URL.trim() }) + ";\n");'

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
