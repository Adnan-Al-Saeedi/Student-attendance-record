name: نشر التطبيق على GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: إنشاء config.js من الأسرار
        env:
          FIREBASE_CONFIG: ${{ secrets.FIREBASE_CONFIG }}
          APP_ADMINS: ${{ secrets.APP_ADMINS }}
        run: |
          if [ -z "$FIREBASE_CONFIG" ]; then echo "::error::أضف السر FIREBASE_CONFIG في إعدادات المستودع"; exit 1; fi
          mkdir -p site
          cp index.html app.js site/
          node -e '
            const cfg = JSON.parse(process.env.FIREBASE_CONFIG);
            const admins = (process.env.APP_ADMINS || "").split(",").map(s => s.trim()).filter(Boolean);
            require("fs").writeFileSync("site/config.js",
              "window.FIREBASE_CONFIG = " + JSON.stringify(cfg) + ";\nwindow.APP_ADMINS = " + JSON.stringify(admins) + ";\n");
          '

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
